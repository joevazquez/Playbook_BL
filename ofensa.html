<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barra Libre - Ofensa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="web-container">
        <!-- Botón Hamburguesa -->
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="sidebar" id="sidebar">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> INICIO</a>
            <a href="ofensa.html" class="nav-item active"><i class="fa-solid fa-football"></i> OFENSA</a>
            <a href="defensa.html" class="nav-item"><i class="fa-solid fa-shield"></i> DEFENSA</a>
        </div>
        <div class="main-content">
            <div class="header-web">
                <img src="LOGO_BL_FEM.jpeg" alt="Logo">
                <h1>OFENSA</h1>
            </div>

            <div class="playbook-grid">
                <!-- TARJETA DE JUGADA 1 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <!-- FRENTE: Nombre y Foto -->
                        <div class="play-card-front">
                            <img src="jugadas/foto_especial.png" alt="Formación 1">
                            <div class="play-name">ESPECIAL</div>
                        </div>
                        <!-- ATRÁS: Video de la Jugada -->
                        <div class="play-card-back">
                            <video autoplay loop muted playsinline>
                                <source src="jugadas/video_especial.mp4" type="video/mp4">
                            </video>
                            <div class="play-desc">ESPECIAL</div>
                        </div>
                    </div>
                </div>

                <!-- TARJETA DE JUGADA 2 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_pistolas.png" alt="Formación 2">
                            <div class="play-name">PISTOLAS</div>
                        </div>
                        <div class="play-card-back">
                            <video autoplay loop muted playsinline>
                                <source src="jugadas/video_pistolas.mp4" type="video/mp4">
                            </video>
                            <div class="play-desc">PISTOLAS</div>
                        </div>
                    </div>
                </div>



                <!-- TARJETA DE JUGADA 3 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_arcoiris.png" alt="Formación 2">
                            <div class="play-name">ARCOIRIS</div>
                        </div>
                        <div class="play-card-back">
                            <video autoplay loop muted playsinline>
                                <source src="jugadas/video_arcoiris.mp4" type="video/mp4">
                            </video>
                            <div class="play-desc">ARCOIRIS</div>
                        </div>
                    </div>
                </div>

                <!-- TARJETA DE JUGADA 4 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_doble_opcion.png" alt="Formación 2">
                            <div class="play-name">DOBLE OPCION</div>
                        </div>
                        <div class="play-card-back">
                            <video autoplay loop muted playsinline>
                                <source src="jugadas/video_doble_opcion.mp4" type="video/mp4">
                            </video>
                            <div class="play-desc">DOBLE OPCION</div>
                        </div>
                    </div>
                </div>

                <!-- TARJETA DE JUGADA 5 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_reversible.png" alt="Formación 2">
                            <div class="play-name">SHOT</div>
                        </div>
                        <div class="play-card-back">
                            <video autoplay loop muted playsinline>
                                <source src="jugadas/video_reversible.mp4" type="video/mp4">
                            </video>
                            <div class="play-desc">SHOT</div>
                        </div>
                    </div>
                </div>

                <!-- TARJETA DE JUGADA 6 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_stops.png" alt="Formación 2">
                            <div class="play-name">STOPS</div>
                        </div>
                        <div class="play-card-back">
                            <video autoplay loop muted playsinline>
                                <source src="jugadas/video_stops.mp4" type="video/mp4">
                            </video>
                            <div class="play-desc">STOPS</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
