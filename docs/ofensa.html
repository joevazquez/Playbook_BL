<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Libre - Ofensa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- BOTÓN HAMBURGUESA -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div class="web-container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> INICIO</a>
            <a href="ofensa.html" class="nav-item active"><i class="fa-solid fa-football"></i> OFENSA</a>
            <a href="defensa.html" class="nav-item"><i class="fa-solid fa-shield"></i> DEFENSA</a>
        </div>

        <!-- CONTENIDO -->
        <div class="main-content">
            <!-- HEADER -->
            <div class="header-web">
                <img src="LOGO_BL_FEM.jpeg" alt="Logo">
                <h1>OFENSA</h1>
            </div>

            <!-- GRID -->
            <div class="playbook-grid">
                <!-- CARD 1 -->
                <div class="play-item">
                    <div class="play-card">
                        <div class="play-card-inner">
                            <div class="play-card-front">
                                <img src="jugadas/foto_especial.png" alt="Especial">
                                <div class="play-name">ESPECIAL</div>
                            </div>
                            <div class="play-card-back">
                                <video muted playsinline loop preload="metadata">
                                    <source src="jugadas/video_especial.mp4" type="video/mp4">
                                </video>
                            </div>
                        </div>
                    </div>
                    <div class="play-description">
                        <div class="player-route">
                            <div class="badge-circle qb">QB</div>
                            <span class="route-text">Rol out derecha y busca ventana clara.</span>
                        </div>
                        
                        <div class="player-route">
                            <div class="badge-circle x">X</div>
                            <span class="route-text">Ruta <strong>Slant</strong> rápida por dentro.</span>
                        </div>
                        
                        <div class="player-route">
                            <div class="badge-circle y">Y</div>
                            <span class="route-text">Hook de 5 yardas y esperar balón.</span>
                        </div>

                        <div class="player-route">
                            <div class="badge-circle z">Z</div>
                            <span class="route-text">Ruta Fly buscando el poste profundo.</span>
                        </div>

                        <div class="player-route">
                            <div class="badge-circle c">C</div>
                            <span class="route-text">Centro limpio y protección de pase.</span>
                        </div>
                    </div>
                </div>   

                <!-- CARD 2 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_pistolas.png" alt="Pistolas">
                            <div class="play-name">PISTOLAS</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop preload="metadata">
                                <source src="jugadas/video_pistolas.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 3 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_reversible.png" alt="Reversible">
                            <div class="play-name">REVERSIBLE</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop preload="metadata">
                                <source src="jugadas/video_reversible.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                 <!-- CARD 4 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_arcoiris.png" alt="Arcoiris">
                            <div class="play-name">ARCOIRIS</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop preload="metadata">
                                <source src="jugadas/video_arcoiris.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 5 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_doble_opcion.png" alt="Doble Opción">
                            <div class="play-name">DOBLE OPCIÓN</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop preload="metadata">
                                <source src="jugadas/video_doble_opcion.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 6 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_stops.png" alt="Stops">
                            <div class="play-name">STOPS</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop preload="metadata">
                                <source src="jugadas/video_stops.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

            </div> <!-- FIN GRID -->
        </div>
    </div>

    <script>
        // --- FUNCIÓN PARA ABRIR/CERRAR MENÚ ---
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const menuBtn = document.querySelector('.menu-toggle');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.classList.toggle('no-scroll');
            
            // Cambio dinámico: Ocultar el botón si el menú está abierto
            if (sidebar.classList.contains('active')) {
                menuBtn.classList.add('hidden');
            } else {
                menuBtn.classList.remove('hidden');
            }
        }

        // --- FUNCIÓN PARA CERRAR TODO ---
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.classList.remove('no-scroll');
            
            // Asegurar que el botón de hamburguesa vuelva a aparecer
            const menuBtn = document.querySelector('.menu-toggle');
            if (menuBtn) menuBtn.classList.remove('hidden');
        }

        // --- LÓGICA DE LAS TARJETAS (Flip y Video optimizado) ---
        document.querySelectorAll('.play-card').forEach(card => {
            let isScrolling = false;
            let startY = 0;

            // Mejoramos la detección de scroll para evitar giros accidentales
            card.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                isScrolling = false;
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                const moveY = Math.abs(e.touches[0].clientY - startY);
                if (moveY > 10) isScrolling = true; // Si se mueve más de 10px verticalmente, es scroll
            }, { passive: true });

            card.addEventListener('click', function () {
                if (isScrolling) return; // No girar si el usuario solo está bajando en la página[cite: 5]

                this.classList.toggle('flip');
                const video = this.querySelector('video');

                if (video) {
                    if (this.classList.contains('flip')) {
                        // Tiempo de espera de 200ms para que la animación se vea fluida
                        setTimeout(() => video.play(), 200);
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                }
            });
        });
    </script>

</body>
</html>
