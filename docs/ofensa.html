<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Libre - Ofensa</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- BOTÓN HAMBURGUESA -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div class="web-container">

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> INICIO</a>
            <a href="ofensa.html" class="nav-item active"><i class="fa-solid fa-football"></i> OFENSA</a>
            <a href="defensa.html" class="nav-item"><i class="fa-solid fa-shield"></i> DEFENSA</a>
        </div>

        <!-- CONTENIDO -->
        <div class="main-content">

            <!-- HEADER -->
            <div class="header-web">
                <img src="LOGO_BL_FEM.jpeg" alt="Logo">
                <h1>OFENSA</h1>
            </div>

            <!-- GRID -->
            <div class="playbook-grid">

                <!-- CARD 1 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_especial.png">
                            <div class="play-name">ESPECIAL</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop>
                                <source src="jugadas/video_especial.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 2 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_pistolas.png">
                            <div class="play-name">PISTOLAS</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop>
                                <source src="jugadas/video_pistolas.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 3 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_arcoiris.png">
                            <div class="play-name">ARCOIRIS</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop>
                                <source src="jugadas/video_arcoiris.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 4 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_doble_opcion.png">
                            <div class="play-name">DOBLE OPCION</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop>
                                <source src="jugadas/video_doble_opcion.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 5 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_reversible.png">
                            <div class="play-name">SHOT</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop>
                                <source src="jugadas/video_reversible.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

                <!-- CARD 6 -->
                <div class="play-card">
                    <div class="play-card-inner">
                        <div class="play-card-front">
                            <img src="jugadas/foto_stops.png">
                            <div class="play-name">STOPS</div>
                        </div>
                        <div class="play-card-back">
                            <video muted playsinline loop>
                                <source src="jugadas/video_stops.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.classList.toggle('no-scroll');
        }

        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        /* 🔥 FIX REAL FLIP + MOBILE */
        document.querySelectorAll('.play-card').forEach(card => {

            let startX = 0;
            let startY = 0;
            let isScrolling = false;

            /* Detectar si el usuario está haciendo scroll */
            card.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isScrolling = false;
            });

            card.addEventListener('touchmove', (e) => {
                let diffX = Math.abs(e.touches[0].clientX - startX);
                let diffY = Math.abs(e.touches[0].clientY - startY);

                if (diffY > diffX) {
                    isScrolling = true; // 🔥 está scrolleando
                }
            });

            card.addEventListener('click', function () {

                if (isScrolling) return; // 🔥 evita flip accidental

                this.classList.toggle('flip');

                const video = this.querySelector('video');

                if (video) {
                    if (this.classList.contains('flip')) {
                        video.play();
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                }
            });

        });
    </script>

</body>
</html>
