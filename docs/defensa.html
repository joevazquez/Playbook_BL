<!DOCTYPE html>
<html lang="es">
<head >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Libre - Defensa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay" onclick="closeMenu()"></div>
    <!-- Botón Hamburguesa -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="web-container">

        <div class="sidebar" id="sidebar">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> INICIO</a>
            <a href="ofensa.html" class="nav-item"><i class="fa-solid fa-football"></i> OFENSA</a>
            <a href="defensa.html" class="nav-item active"><i class="fa-solid fa-shield"></i> DEFENSA</a>
        </div>
        <div class="main-content">
            <div class="header-web">
                <img src="LOGO_BL_FEM.jpeg" alt="Logo">
                <h1>DEFENSA</h1>
            </div>
            <div class="rules-container">
                <p>Aquí irán las coberturas y el sistema defensivo del equipo.</p>
            </div>
        </div>
    </div>
    <script>
        // --- FUNCIÓN PARA ABRIR/CERRAR MENÚ ---
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.classList.toggle('no-scroll');
        }

        // --- FUNCIÓN PARA CERRAR AL TOCAR FUERA O EN EL OVERLAY ---
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        // --- LÓGICA DE LAS TARJETAS (Giro y Video) ---
        document.querySelectorAll('.play-card').forEach(card => {
            let startX, startY, isScrolling;

            // Detectar inicio de toque para no girar la carta si solo quieres hacer scroll
            card.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isScrolling = false;
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                let diffX = Math.abs(e.touches[0].clientX - startX);
                let diffY = Math.abs(e.touches[0].clientY - startY);
                // Si el movimiento es más vertical que horizontal, es un scroll
                if (diffY > diffX) isScrolling = true;
            }, { passive: true });

            card.addEventListener('click', function () {
                // Si el usuario estaba haciendo scroll, no girar la carta
                if (isScrolling) return;

                this.classList.toggle('flip');
                const video = this.querySelector('video');

                if (video) {
                    if (this.classList.contains('flip')) {
                        // Esperar un poco a que la carta gire para dar play
                        setTimeout(() => video.play(), 100);
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                }
            });
        });
    </script>
</body>
</html>
