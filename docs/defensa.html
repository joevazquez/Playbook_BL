<!DOCTYPE html>
<html lang="es">
<head >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Libre - Defensa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay" onclick="closeMenu()"></div>
    <!-- Botón Hamburguesa -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="web-container">

        <div class="sidebar" id="sidebar">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> INICIO</a>
            <a href="ofensa.html" class="nav-item"><i class="fa-solid fa-football"></i> OFENSA</a>
            <a href="defensa.html" class="nav-item active"><i class="fa-solid fa-shield"></i> DEFENSA</a>
        </div>
        <div class="main-content">
            <div class="header-web">
                <img src="LOGO_BL_FEM.jpeg" alt="Logo">
                <h1>DEFENSA</h1>
            </div>
            <div class="rules-container">
                <p>Aquí irán las coberturas y el sistema defensivo del equipo.</p>
            </div>
        </div>
    </div>
    
    <script>
        // --- FUNCIÓN PARA ABRIR/CERRAR MENÚ ---
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const menuBtn = document.querySelector('.menu-toggle');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.classList.toggle('no-scroll');
            
            // Cambio dinámico: Ocultar el botón si el menú está abierto
            if (sidebar.classList.contains('active')) {
                menuBtn.classList.add('hidden');
            } else {
                menuBtn.classList.remove('hidden');
            }
        }

        // --- FUNCIÓN PARA CERRAR TODO ---
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.classList.remove('no-scroll');
            
            // Asegurar que el botón de hamburguesa vuelva a aparecer
            const menuBtn = document.querySelector('.menu-toggle');
            if (menuBtn) menuBtn.classList.remove('hidden');
        }

        // --- LÓGICA DE LAS TARJETAS (Flip y Video optimizado) ---
        document.querySelectorAll('.play-card').forEach(card => {
            let isScrolling = false;
            let startY = 0;

            // Mejoramos la detección de scroll para evitar giros accidentales
            card.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                isScrolling = false;
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                const moveY = Math.abs(e.touches[0].clientY - startY);
                if (moveY > 10) isScrolling = true; // Si se mueve más de 10px verticalmente, es scroll
            }, { passive: true });

            card.addEventListener('click', function () {
                if (isScrolling) return; // No girar si el usuario solo está bajando en la página[cite: 5]

                this.classList.toggle('flip');
                const video = this.querySelector('video');

                if (video) {
                    if (this.classList.contains('flip')) {
                        // Tiempo de espera de 200ms para que la animación se vea fluida
                        setTimeout(() => video.play(), 200);
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                }
            });
        });
    </script>
</body>
</html>
